<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121E"/>
      <stop offset="50%" stop-color="#141A2B"/>
      <stop offset="100%" stop-color="#0B0E16"/>
    </linearGradient>
    <linearGradient id="cloudBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#C96D4F"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="520" fill="url(#cloudBg)"/>
  <rect x="24" y="24" width="752" height="472" rx="4" fill="none" stroke="url(#cloudBorder)" stroke-width="2"/>
  <rect x="34" y="34" width="732" height="452" rx="2" fill="none" stroke="#F5F0E7" stroke-opacity="0.1" stroke-width="1"/>

  <g transform="translate(400, 75)" text-anchor="middle">
