  </text>

  <!-- Seal -->
  <g transform="translate(640, 410)">
    <circle cx="0" cy="0" r="34" fill="#0E121E" stroke="#6366F1" stroke-width="2"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#6366F1" stroke-width="1" stroke-dasharray="3 2"/>
    <polygon points="0,-16 4,-6 14,-6 6,2 9,12 0,6 -9,12 -6,2 -14,-6 -4,-6" fill="#6366F1"/>
    <text x="0" y="18" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#F7F4EE" letter-spacing="1">CLOUD CERTIFIED</text>
