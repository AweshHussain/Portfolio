  </text>

  <line x1="260" y1="225" x2="540" y2="225" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="400" cy="225" r="3" fill="#6366F1"/>

  <text x="400" y="258" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#7A766F" letter-spacing="3">
