    <text x="0" y="13" font-family="'Courier New', monospace" font-size="12" font-weight="900" fill="#FFFFFF" letter-spacing="3">IBM</text>
    <text x="0" y="44" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#6366F1" letter-spacing="4">CLOUD &amp; DATA PLATFORM CERTIFICATION</text>
  </g>

  <text x="400" y="170" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#F7F4EE" letter-spacing="1">
    Cloud Computing &amp; NoSQL Document Databases
  </text>
  <text x="400" y="198" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#6366F1" letter-spacing="2">
