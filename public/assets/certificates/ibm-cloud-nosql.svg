    <text x="0" y="16" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#F7F4EE">IBM CLOUD INITIATIVE</text>
    <text x="0" y="28" font-family="'Courier New', monospace" font-size="8" fill="#7A766F">ID: IBM-CLD-DOC-3190</text>
