  <g transform="translate(360, 420)">
    <text x="0" y="16" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#A19D95">Issued</text>
    <text x="0" y="28" font-family="'Courier New', monospace" font-size="8" fill="#6366F1">2024</text>
