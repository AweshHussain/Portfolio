<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="mlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12100E"/>
      <stop offset="50%" stop-color="#1A1613"/>
      <stop offset="100%" stop-color="#0F0D0C"/>
    </linearGradient>
    <linearGradient id="mlBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C96D4F"/>
      <stop offset="50%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#8F432B"/>
    </linearGradient>
    <radialGradient id="mlSeal" cx="50%" cy="50%" r="50%">
