  </defs>

  <rect width="800" height="520" fill="url(#mlBg)"/>
  <rect x="24" y="24" width="752" height="472" rx="4" fill="none" stroke="url(#mlBorder)" stroke-width="2"/>
  <rect x="34" y="34" width="732" height="452" rx="2" fill="none" stroke="#F5F0E7" stroke-opacity="0.1" stroke-width="1"/>

  <g transform="translate(400, 75)" text-anchor="middle">
    <rect x="-35" y="0" width="70" height="18" fill="#1F70C1" rx="2" opacity="0.9"/>
    <text x="0" y="13" font-family="'Courier New', monospace" font-size="12" font-weight="900" fill="#FFFFFF" letter-spacing="3">IBM</text>
    <text x="0" y="44" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#C96D4F" letter-spacing="4">SKILLS NETWORK CERTIFICATION</text>
  </g>

  <text x="400" y="170" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#F7F4EE" letter-spacing="1">
