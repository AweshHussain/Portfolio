<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <radialGradient id="aiGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D2726"/>
      <stop offset="60%" stop-color="#191716"/>
      <stop offset="100%" stop-color="#0E0D0C"/>
    </radialGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C96D4F"/>
      <stop offset="100%" stop-color="#EAE2D6"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#aiGrad)"/>
  
  <!-- AI Neural Network Nodes -->
  <g opacity="0.6">
    <line x1="250" y1="200" x2="400" y2="150" stroke="url(#glowLine)" stroke-width="1.5"/>
    <line x1="250" y1="200" x2="400" y2="250" stroke="url(#glowLine)" stroke-width="1.5"/>
    <line x1="250" y1="300" x2="400" y2="250" stroke="url(#glowLine)" stroke-width="1.5"/>
    <line x1="250" y1="300" x2="400" y2="350" stroke="url(#glowLine)" stroke-width="1.5"/>
    <line x1="400" y1="150" x2="550" y2="250" stroke="url(#glowLine)" stroke-width="1.5"/>
    <line x1="400" y1="250" x2="550" y2="250" stroke="url(#glowLine)" stroke-width="2"/>
    <line x1="400" y1="350" x2="550" y2="250" stroke="url(#glowLine)" stroke-width="1.5"/>
    
    <circle cx="250" cy="200" r="10" fill="#EAE2D6"/>
    <circle cx="250" cy="300" r="10" fill="#EAE2D6"/>
    <circle cx="400" cy="150" r="12" fill="#C96D4F"/>
    <circle cx="400" cy="250" r="16" fill="#DA8468"/>
    <circle cx="400" cy="350" r="12" fill="#C96D4F"/>
    <circle cx="550" cy="250" r="14" fill="#F5F0E7"/>
  </g>
  
  <!-- Dialogue Bubble / Workflow Card -->
  <rect x="40" y="40" width="300" height="70" rx="8" fill="#171717" fill-opacity="0.8" stroke="#F5F0E7" stroke-opacity="0.15"/>
  <text x="60" y="68" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#C96D4F" letter-spacing="1.5">CONVERSATIONAL AI & LLMS</text>
  <text x="60" y="92" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#F5F0E7">Personal AI Assistant Architecture</text>
</svg>
