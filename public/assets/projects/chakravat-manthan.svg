<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <radialGradient id="cycloneGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3A6D8C" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#1A334B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0E1E2E" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F0E7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C96D4F" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="#0D1B2A"/>
  <rect width="800" height="500" fill="url(#cycloneGrad)"/>
  
  <!-- Radar Rings & Grid -->
  <circle cx="400" cy="250" r="80" stroke="#F5F0E7" stroke-opacity="0.15" stroke-dasharray="4 4"/>
  <circle cx="400" cy="250" r="160" stroke="#F5F0E7" stroke-opacity="0.12"/>
  <circle cx="400" cy="250" r="240" stroke="#F5F0E7" stroke-opacity="0.08"/>
  <line x1="100" y1="250" x2="700" y2="250" stroke="#F5F0E7" stroke-opacity="0.1"/>
  <line x1="400" y1="50" x2="400" y2="450" stroke="#F5F0E7" stroke-opacity="0.1"/>
  
  <!-- Cyclone Swirl Spiral -->
  <path d="M 400 250 Q 430 200, 480 210 T 540 280 T 450 360 T 310 320 T 300 180 T 420 120 T 580 170" fill="none" stroke="url(#cloudGrad)" stroke-width="28" stroke-linecap="round" opacity="0.6"/>
  <path d="M 400 250 Q 370 280, 330 260 T 290 190 T 370 130 T 490 160 T 520 280" fill="none" stroke="#F5F0E7" stroke-width="14" stroke-linecap="round" opacity="0.4"/>
  <circle cx="400" cy="250" r="12" fill="#C96D4F"/>
  <circle cx="400" cy="250" r="24" stroke="#C96D4F" stroke-opacity="0.6" stroke-width="2"/>
  
  <!-- Overlay Card & Info -->
  <rect x="40" y="40" width="300" height="70" rx="8" fill="#111111" fill-opacity="0.75" stroke="#F5F0E7" stroke-opacity="0.15"/>
  <text x="60" y="68" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#C96D4F" letter-spacing="1.5">SATELLITE REMOTE SENSING</text>
  <text x="60" y="92" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#F5F0E7">Chakravat Manthan • Cyclone Model</text>
</svg>
