<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1E18"/>
      <stop offset="50%" stop-color="#1F1A17"/>
      <stop offset="100%" stop-color="#141110"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C96D4F"/>
      <stop offset="100%" stop-color="#F5F0E7"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#carGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="100" y1="380" x2="720" y2="380" stroke="#F5F0E7" stroke-opacity="0.15" stroke-width="1.5"/>
  <line x1="100" y1="280" x2="720" y2="280" stroke="#F5F0E7" stroke-opacity="0.08" stroke-dasharray="4 4"/>
  <line x1="100" y1="180" x2="720" y2="180" stroke="#F5F0E7" stroke-opacity="0.08" stroke-dasharray="4 4"/>
  
  <!-- Car Silhouette Outline -->
  <path d="M 180 340 L 250 340 L 310 270 L 490 270 L 560 320 L 640 330 L 640 355 L 180 355 Z" fill="#C96D4F" fill-opacity="0.15" stroke="#C96D4F" stroke-width="2"/>
  <circle cx="270" cy="355" r="24" fill="#141110" stroke="#C96D4F" stroke-width="3"/>
  <circle cx="550" cy="355" r="24" fill="#141110" stroke="#C96D4F" stroke-width="3"/>
  
  <!-- Regression Curve Curve -->
  <path d="M 120 360 C 240 330, 380 230, 520 200 S 680 140, 710 120" fill="none" stroke="url(#lineGrad)" stroke-width="4"/>
  <circle cx="520" cy="200" r="6" fill="#C96D4F"/>
  <circle cx="380" cy="245" r="5" fill="#F5F0E7" opacity="0.8"/>
  <circle cx="620" cy="160" r="5" fill="#F5F0E7" opacity="0.8"/>
  
  <!-- Metrics Card -->
  <rect x="40" y="40" width="310" height="70" rx="8" fill="#171717" fill-opacity="0.8" stroke="#F5F0E7" stroke-opacity="0.15"/>
  <text x="60" y="68" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#C96D4F" letter-spacing="1.5">REGRESSION & ANALYTICS</text>
  <text x="60" y="92" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#F5F0E7">Used Car Price Valuation Engine</text>
</svg>
